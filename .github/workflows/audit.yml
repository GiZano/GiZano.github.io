name: Pre-flight Quality & Privacy Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    name: Run Strict Pre-flight Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set audit script permissions
        run: chmod +x scripts/audit.sh scripts/audit-live.sh

      - name: Execute audit checks (including 20-page mobile overflow)
        run: ./scripts/audit.sh
