<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to ClimbStack Privacy Policy...</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://climbstack.github.io/privacy.html">
  <meta http-equiv="refresh" content="0; url=https://climbstack.github.io/privacy.html">
  <script>
    window.location.replace("https://climbstack.github.io/privacy.html" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      background-color: #0D1117;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .redirect-card {
      background-color: #161B22;
      border: 1px solid #30363D;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #8B949E;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      background-color: #4397B8;
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #327A97;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1>Privacy Policy Moved</h1>
    <p>The LevelUp privacy policy has moved to ClimbStack.</p>
    <a href="https://climbstack.github.io/privacy.html">Proceed to Privacy Policy</a>
  </div>
</body>
</html>
