    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 2rem 1rem;
        }

        /* Accessibilità: Focus visibile */

        .links-container {

            text-align: center;
        }

        /* ── Profile ─────────────────────────────── */
        .profile-photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.25);
            margin-bottom: 1rem;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .profile-handle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 0.2rem;
            font-weight: 400;
        }

        .profile-tagline {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.5rem;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        /* ── Link buttons ────────────────────────── */
        .links-list {
            list-style: none;
            padding: 0;
            margin: 2rem 0 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            padding: 0.9rem 1.25rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .link-btn:hover, .link-btn:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        .link-btn:active {
            transform: translateY(0);
        }

        .link-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .link-label { flex: 1; text-align: left; }

        .link-arrow {
            color: #475569;
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        .link-btn:hover .link-arrow { transform: translateX(3px); color: #94a3b8; }

        /* ── Brand colors for icons ──────────────── */
        .icon-portfolio  { background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; }
        .icon-orcid      { background: #a6ce39; color: #fff; }
        .icon-linkedin   { background: #0a66c2; color: #fff; }
        .icon-github     { background: #333;    color: #fff; }
        .icon-hashnode   { background: #2962ff; color: #fff; }
        .icon-youtube    { background: #ff0000; color: #fff; }
        .icon-mastodon   { background: #6364ff; color: #fff; }
        .icon-devto      { background: #0a0a0a; color: #fff; }
        .icon-bluesky    { background: #0085ff; color: #fff; }
        .icon-email      { background: linear-gradient(135deg, #ea4335, #fbbc05); color: #fff; }

        /* ── Disabled / coming-soon links ────────── */
        .link-btn.disabled {
            opacity: 0.45;
            pointer-events: none;
            cursor: default;
        }

        .badge-wip {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 0.2em 0.55em;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* ── Footer ──────────────────────────────── */
        .links-footer {
            margin-top: 2.5rem;
            font-size: 0.78rem;
            color: #475569;
        }

        .links-footer a {
            color: #64748b;
            text-decoration: none;
        }

        .links-footer a:hover { color: #94a3b8; text-decoration: underline; }

        /* ── Subtle entrance animation ───────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .links-container { animation: fadeUp 0.5s ease-out; }

        .links-list li {
            opacity: 0;
            animation: fadeUp 0.4s ease-out forwards;
        }

        .links-list li:nth-child(1)  { animation-delay: 0.08s; }
        .links-list li:nth-child(2)  { animation-delay: 0.12s; }
        .links-list li:nth-child(3)  { animation-delay: 0.16s; }
        .links-list li:nth-child(4)  { animation-delay: 0.2s;  }
        .links-list li:nth-child(5)  { animation-delay: 0.24s; }
        .links-list li:nth-child(6)  { animation-delay: 0.28s; }
        .links-list li:nth-child(7)  { animation-delay: 0.32s; }
        .links-list li:nth-child(8)  { animation-delay: 0.36s; }
        .links-list li:nth-child(9)  { animation-delay: 0.4s;  }
        .links-list li:nth-child(10) { animation-delay: 0.44s; }
    </style>
